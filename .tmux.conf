##### Terminal capabilities ###################################################

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Preserve modified keys and true color through Ghostty -> tmux -> Neovim.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -g focus-events on

# Clipboard writes from tmux copy-mode can reach the macOS clipboard via OSC 52.
set -g set-clipboard on

# Keep Escape and Alt key chords responsive in Neovim.
set -sg escape-time 10

# Use vi semantics in tmux copy mode.
set -g status-keys vi
setw -g mode-keys vi
set -g mouse on

##### Sessions, windows, and panes ############################################

set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep Ghostty's title useful while tmux is attached.
set -g set-titles on
set -g set-titles-string '#S:#I #{pane_title}'

# New panes and windows start in the current pane's directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Reload without leaving the session.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### Neovim-aware pane navigation ############################################

# smart-splits.nvim sets @pane-is-vim for Neovim panes. The same keys then
# move inside Neovim or cross into an adjacent tmux pane.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# Ghostty maps Command-S to Ctrl-S. Forward it to Neovim only; consuming it in
# shell panes prevents Ctrl-S from enabling terminal software flow control.
bind-key -n C-s if -F "#{@pane-is-vim}" 'send-keys C-s' ''

# Alt-h/j/k/l resize either the active Neovim split or tmux pane.
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# Keep navigation predictable while tmux copy-mode is active.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
